# Pushing a `v*` tag builds the bundle and *then* creates the release with it
# attached. Deliberately in that order: HACS installs a plugin from the release
# asset named in hacs.json, so a release that exists without its asset is a broken
# install for anyone who catches that window. Creating the release last means a
# failed build publishes nothing at all, which is the safe way round.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ci, not install: the lockfile is the record of what was tested.
      - run: npm ci

      - run: npm run build

      # The asset name and `filename` in hacs.json must stay identical.
      - name: Check the bundle exists
        run: test -s dist/scrypted-camera-card.js

      # Release notes come from the matching CHANGELOG section, so what HACS shows
      # users is the same text the repository carries. Falls back to generated notes
      # rather than publishing an empty body.
      - name: Collect release notes
        run: |
          awk '/^## /{ if (n++) exit; next } n' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "NOTES=generate" >> "$GITHUB_ENV"; fi

      # gh is preinstalled on the runner, so this needs no third-party action.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$NOTES" = "generate" ]; then
            gh release create "$GITHUB_REF_NAME" dist/scrypted-camera-card.js \
              --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" dist/scrypted-camera-card.js \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
